<!-- tools/glyph-designer.html -->
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glyph Designer</title>
    <style>
        :root {
            --bg: #f6f7fb;
            --panel: #ffffff;
            --panel-2: #f0f2f7;
            --text: #111318;
            --muted: #626a7a;
            --border: #d7dbe5;
            --accent: #2f6feb;
            --danger: #d73a49;
            --grid-stroke: #9aa3b2;
            --cell-off: #ffffff;
            --cell-on: #000000;
            --cell-oob: #e9edf5;
            --guide-cap: rgba(47, 111, 235, 0.35);
            --guide-xheight: rgba(147, 51, 234, 0.35);
            --guide-mid: rgba(234, 179, 8, 0.35);
            --guide-base: rgba(16, 185, 129, 0.45);
            --guide-desc: rgba(239, 68, 68, 0.35);
            --shadow: 0 10px 30px rgba(0,0,0,0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d1117;
                --panel: #161b22;
                --panel-2: #0f141b;
                --text: #e6edf3;
                --muted: #9aa4b2;
                --border: #2a3340;
                --accent: #58a6ff;
                --danger: #ff7b72;
                --grid-stroke: #6b7280;
                --cell-off: #f8fafc;
                --cell-on: #0b0d10;
                --cell-oob: #313844;
                --guide-cap: rgba(88, 166, 255, 0.4);
                --guide-xheight: rgba(216, 180, 254, 0.35);
                --guide-mid: rgba(253, 224, 71, 0.35);
                --guide-base: rgba(52, 211, 153, 0.45);
                --guide-desc: rgba(252, 165, 165, 0.35);
                --shadow: 0 10px 30px rgba(0,0,0,0.35);
            }
        }

        html[data-theme="light"] { color-scheme: light; }
        html[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0d1117;
            --panel: #161b22;
            --panel-2: #0f141b;
            --text: #e6edf3;
            --muted: #9aa4b2;
            --border: #2a3340;
            --accent: #58a6ff;
            --danger: #ff7b72;
            --grid-stroke: #6b7280;
            --cell-off: #f8fafc;
            --cell-on: #0b0d10;
            --cell-oob: #313844;
            --guide-cap: rgba(88, 166, 255, 0.4);
            --guide-xheight: rgba(216, 180, 254, 0.35);
            --guide-mid: rgba(253, 224, 71, 0.35);
            --guide-base: rgba(52, 211, 153, 0.45);
            --guide-desc: rgba(252, 165, 165, 0.35);
            --shadow: 0 10px 30px rgba(0,0,0,0.35);
        }

        * { box-sizing: border-box; }

        html, body {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Inter, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .wrap {
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 16px;
            min-height: 100vh;
            display: grid;
            gap: 16px;
            grid-template-columns: minmax(380px, 460px) minmax(0, 1fr);
            align-items: start;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
            min-width: 0;
        }

        .left {
            padding: 14px;
            display: grid;
            gap: 12px;
            align-content: start;
            position: sticky;
            top: 16px;
        }

        .toolbar { display: grid; gap: 8px; }

        .row {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            gap: 8px;
            align-items: end;
        }

        .field { display: grid; gap: 4px; }

        .field label {
            font-size: 12px;
            color: var(--muted);
        }

        input[type="text"], select, button, textarea { font: inherit; }

        input[type="text"], select {
            height: 34px;
            border: 1px solid var(--border);
            background: var(--panel-2);
            color: var(--text);
            border-radius: 8px;
            padding: 0 10px;
            outline: none;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 20%, transparent);
        }

        .btns {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        button {
            border: 1px solid var(--border);
            background: var(--panel-2);
            color: var(--text);
            height: 34px;
            border-radius: 8px;
            padding: 0 10px;
            cursor: pointer;
        }

        button:hover { border-color: var(--accent); }

        button.primary {
            background: color-mix(in oklab, var(--accent) 16%, var(--panel-2));
            border-color: color-mix(in oklab, var(--accent) 50%, var(--border));
        }

        .hint {
            color: var(--muted);
            font-size: 12px;
        }

        .status {
            font-size: 12px;
            color: var(--muted);
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            padding: 2px 0 0;
        }

        .status code {
            background: var(--panel-2);
            border: 1px solid var(--border);
            padding: 1px 6px;
            border-radius: 999px;
            color: var(--text);
        }

        .grid-wrap {
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            user-select: none;
        }

        .grid-top-labels,
        .grid-left-labels {
            display: grid;
            gap: 0;
            color: var(--muted);
            font-size: 11px;
            line-height: 1;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 36px 1fr;
            grid-template-rows: 18px auto;
            gap: 6px;
            align-items: start;
        }

        .grid-top-labels {
            grid-column: 2;
            grid-row: 1;
            grid-template-columns: repeat(5, 1fr);
            padding: 0 4px;
        }

        .grid-top-labels span { text-align: center; }

        .grid-left-labels {
            grid-column: 1;
            grid-row: 2;
            grid-template-rows: 1fr 3fr 5fr 1fr 4fr 1fr 4fr 1fr 5fr 4fr 1fr;
            height: 100%;
            padding: 2px 2px 2px 0;
        }

        .grid-left-labels span {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 4px;
        }

        #editorSvg {
            grid-column: 2;
            grid-row: 2;
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            background: #fff;
            border: 1px solid var(--border);
            touch-action: none;
        }

        #editorSvg .cell {
            fill: var(--cell-off);
            stroke: var(--grid-stroke);
            stroke-width: 0.15;
            cursor: pointer;
        }

        #editorSvg .cell.active { fill: var(--cell-on); }

        #editorSvg .cell.oob {
            fill: var(--cell-oob);
            cursor: not-allowed;
            opacity: 0.8;
        }

        #editorSvg .guide {
            stroke-width: 0.15;
            vector-effect: non-scaling-stroke;
            pointer-events: none;
            shape-rendering: crispEdges;
        }

        #editorSvg .guide.cap { stroke: var(--guide-cap); }
        #editorSvg .guide.xheight { stroke: var(--guide-xheight); }
        #editorSvg .guide.mid { stroke: var(--guide-mid); }
        #editorSvg .guide.base { stroke: var(--guide-base); }
        #editorSvg .guide.desc { stroke: var(--guide-desc); }

        #editorSvg .guide.baseline {
            stroke: #3b82f6;
            stroke-width: 0.2;
            vector-effect: non-scaling-stroke;
            pointer-events: none;
            shape-rendering: crispEdges;
        }

        .right {
            display: grid;
            grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
            gap: 16px;
            min-width: 0;
            min-height: calc(100vh - 32px);
        }

        .stack {
            display: grid;
            gap: 10px;
            padding: 14px;
            min-height: 0;
        }

        .stack h3 {
            margin: 0;
            font-size: 13px;
            color: var(--muted);
            font-weight: 600;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        textarea {
            width: 100%;
            min-height: 260px;
            resize: vertical;
            border: 1px solid var(--border);
            background: var(--panel-2);
            color: var(--text);
            border-radius: 10px;
            padding: 10px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
            line-height: 1.35;
            white-space: pre;
        }

        .preview-box {
            border: 1px solid var(--border);
            background: var(--panel-2);
            border-radius: 10px;
            padding: 10px;
            min-height: 92px;
            display: grid;
            align-items: center;
        }

        #svgPreview {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 70px;
            overflow: auto;
        }

        #svgPreview svg {
            max-width: 100%;
            height: auto;
        }

        #svgPreview svg polygon {
            fill: #000;
            stroke: none;
        }

        .footer-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .warn {
            color: var(--danger);
            font-size: 12px;
            min-height: 16px;
            white-space: pre-wrap;
        }

        @media (max-width: 1040px) {
            .wrap {
                grid-template-columns: 1fr;
                min-height: auto;
            }

            .left {
                position: static;
                top: auto;
            }

            .right {
                grid-template-rows: auto auto;
                min-height: auto;
            }
        }
    </style>
</head>
<body>
<div class="wrap">
    <section class="panel left">
        <div class="toolbar">
            <div class="row">
                <div class="field" style="grid-column: span 2;">
                    <label for="glyphChar">Character</label>
                    <input id="glyphChar" type="text" value="A" inputmode="text" />
                </div>

                <div class="field" style="grid-column: span 3;">
                    <label for="widthUnits">Width</label>
                    <select id="widthUnits">
                        <option value="1">1 unit (4)</option>
                        <option value="2">2 units (8)</option>
                        <option value="3" selected>3 units (12)</option>
                        <option value="4">4 units (16)</option>
                        <option value="5">5 units (20)</option>
                    </select>
                </div>

                <div class="field" style="grid-column: span 3;">
                    <label for="themeMode">Theme</label>
                    <select id="themeMode">
                        <option value="device" selected>Device</option>
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                    </select>
                </div>

                <div class="field" style="grid-column: span 4;">
                    <label>&nbsp;</label>
                    <div class="btns">
                        <button id="loadPresetBtn" class="primary" type="button">Load stored glyph</button>
                        <button id="blankBtn" type="button">Blank</button>
                    </div>
                </div>
            </div>

            <div class="btns">
                <button id="spaceBtn" type="button">Space</button>
                <button id="clearBtn" type="button">Clear</button>
                <button id="invertBtn" type="button">Invert in width</button>
                <button id="fitWidthBtn" type="button">Fit width</button>
                <button id="copySvgBtn" type="button">Copy SVG</button>
                <button id="copyJsonBtn" type="button">Copy JSON</button>
            </div>

            <div class="hint">
                Click to toggle. Drag to paint. Glyphs are loaded from <code>../data/glyphs.json</code> when available.
            </div>
            <div id="warn" class="warn"></div>
            <div class="status">
                <span>Codepoint <code id="codepointBadge">U+0041</code></span>
                <span>Stored glyphs <code id="glyphStoreBadge">loading…</code></span>
                <span>Active areas <code id="activeCountBadge">0</code></span>
                <span>Export rects <code id="rectCountBadge">0</code></span>
                <span>ViewBox <code id="viewBoxBadge">0 0 12 30</code></span>
            </div>
        </div>

        <div class="grid-wrap">
            <div class="grid-layout">
                <div class="grid-top-labels">
                    <span>0–4</span>
                    <span>4–8</span>
                    <span>8–12</span>
                    <span>12–16</span>
                    <span>16–20</span>
                </div>

                <div class="grid-left-labels" aria-hidden="true">
                    <span>0–1</span>
                    <span>1–4</span>
                    <span>4–9</span>
                    <span>9–10</span>
                    <span>10–14</span>
                    <span>14–15</span>
                    <span>15–19</span>
                    <span>19–20</span>
                    <span>20–25</span>
                    <span>25–29</span>
                    <span>29–30</span>
                </div>

                <svg id="editorSvg" viewBox="0 0 20 30" preserveAspectRatio="xMidYMid meet" aria-label="Glyph grid editor"></svg>
            </div>
        </div>
    </section>

    <section class="right">
        <div class="panel stack">
            <h3>JSON data</h3>
            <textarea id="jsonOut" spellcheck="false"></textarea>
            <div class="footer-actions">
                <button id="downloadJsonBtn" type="button">Download JSON</button>
            </div>
        </div>

        <div class="panel stack">
            <h3>SVG markup</h3>
            <div class="preview-box">
                <div id="svgPreview"></div>
            </div>
            <textarea id="svgOut" spellcheck="false"></textarea>
            <div class="footer-actions">
                <button id="downloadSvgBtn" class="primary" type="button">Download SVG</button>
            </div>
        </div>
    </section>
</div>

<script>
    const GLYPH_DATA_URL = "../data/glyphs.json";
    const THEME_STORAGE_KEY = "unst-glyph-designer-theme";

    // -----------------------------
    // Metrics / partition grid
    // -----------------------------
    const X_BREAKS = [0, 4, 8, 12, 16, 20];
    const Y_BREAKS = [0, 1, 4, 9, 10, 14, 15, 19, 20, 25, 29, 30];

    const CELL_H = 30;
    const Y = {
        CAP0: 0,  CAP1: 1,
        TOP0: 9,  TOP1: 10,
        MID0: 14, MID1: 15,
        BASE0: 19, BASE1: 20,
        DESC0: 29, DESC1: 30
    };

    const COLS = X_BREAKS.length - 1;
    const ROWS = Y_BREAKS.length - 1;
    const $ = (id) => document.getElementById(id);

    const editorSvg = $("editorSvg");
    const glyphCharInput = $("glyphChar");
    const widthUnitsSelect = $("widthUnits");
    const themeModeSelect = $("themeMode");
    const jsonOut = $("jsonOut");
    const svgOut = $("svgOut");
    const svgPreview = $("svgPreview");
    const warnEl = $("warn");

    const codepointBadge = $("codepointBadge");
    const glyphStoreBadge = $("glyphStoreBadge");
    const activeCountBadge = $("activeCountBadge");
    const rectCountBadge = $("rectCountBadge");
    const viewBoxBadge = $("viewBoxBadge");

    const state = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
    const cellEls = Array.from({ length: ROWS }, () => Array(COLS).fill(null));

    const glyphStore = new Map();
    const glyphDataState = {
        loading: false,
        loaded: false,
        error: "",
        count: 0
    };

    let pointerDrag = { active: false, value: true, id: null };

    // -----------------------------
    // Helpers
    // -----------------------------
    function R(x1, y1, x2, y2) { return [x1, y1, x2, y2]; }

    function rectToPoly(rect) {
        const [x1, y1, x2, y2] = rect;
        return [[x1, y1], [x2, y1], [x2, y2], [x1, y2]];
    }

    function polyPoints(poly) {
        return poly.map(([x, y]) => `${x},${y}`).join(" ");
    }

    function clamp(n, min, max) {
        return Math.max(min, Math.min(max, n));
    }

    function currentWidth() {
        return Number(widthUnitsSelect.value) * 4;
    }

    function inBoundsCell(r, c) {
        return X_BREAKS[c + 1] <= currentWidth();
    }

    function getRawInput() {
        return glyphCharInput.value ?? "";
    }

    function getGlyphChar() {
        const chars = Array.from(getRawInput());
        return chars[0] || "";
    }

    function inputHasMultipleChars() {
        return Array.from(getRawInput()).length > 1;
    }

    function codepointHex(ch) {
        if (!ch) return "0000";
        return ch.codePointAt(0).toString(16).padStart(4, "0");
    }

    function printableName(ch) {
        if (ch === "") return "(none)";
        if (ch === " ") return "SPACE";
        return ch;
    }

    function filenameForCurrentGlyph(ext) {
        const ch = getGlyphChar();
        if (!ch) return `character.${ext}`;
        return `character-u${codepointHex(ch)}.${ext}`;
    }

    function clearState() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                state[r][c] = false;
            }
        }
    }

    function activeCellCount() {
        let n = 0;
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (state[r][c] && inBoundsCell(r, c)) n++;
            }
        }
        return n;
    }

    function cellRect(r, c) {
        return [X_BREAKS[c], Y_BREAKS[r], X_BREAKS[c + 1], Y_BREAKS[r + 1]];
    }

    function rectCoversCell(rect, cell) {
        const [rx1, ry1, rx2, ry2] = rect;
        const [cx1, cy1, cx2, cy2] = cell;
        return rx1 <= cx1 && ry1 <= cy1 && rx2 >= cx2 && ry2 >= cy2;
    }

    function escapeXmlAttr(str) {
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }

    function arraysEqualNumberwise(a, b) {
        if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) return false;
        for (let i = 0; i < a.length; i++) {
            if (Number(a[i]) !== Number(b[i])) return false;
        }
        return true;
    }

    function applyPaint(r, c, value) {
        if (!inBoundsCell(r, c)) return;
        state[r][c] = value;
        updateUI();
    }

    function invertInBounds() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (inBoundsCell(r, c)) state[r][c] = !state[r][c];
            }
        }
        updateUI();
    }

    function fitWidthToContent() {
        let maxUsedCol = -1;
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (state[r][c]) maxUsedCol = Math.max(maxUsedCol, c);
            }
        }
        const units = clamp(maxUsedCol + 1, 1, 5);
        widthUnitsSelect.value = String(units || 3);
        updateUI();
    }

    function collectMergedRects() {
        const runs = [];

        for (let r = 0; r < ROWS; r++) {
            let c = 0;
            while (c < COLS) {
                if (!inBoundsCell(r, c) || !state[r][c]) {
                    c++;
                    continue;
                }

                const start = c;
                c++;
                while (c < COLS && inBoundsCell(r, c) && state[r][c]) c++;

                runs.push({
                    x1: X_BREAKS[start],
                    x2: X_BREAKS[c],
                    y1: Y_BREAKS[r],
                    y2: Y_BREAKS[r + 1]
                });
            }
        }

        const merged = [];
        for (const run of runs) {
            let found = null;
            for (const rect of merged) {
                if (rect.x1 === run.x1 && rect.x2 === run.x2 && rect.y2 === run.y1) {
                    found = rect;
                    break;
                }
            }
            if (found) {
                found.y2 = run.y2;
            } else {
                merged.push({ ...run });
            }
        }

        return merged.map(r => [r.x1, r.y1, r.x2, r.y2]);
    }

    function currentPolys() {
        return collectMergedRects().map(rectToPoly);
    }

    function currentJsonObject() {
        const ch = getGlyphChar();
        const width = currentWidth();

        return {
            key: ch,
            label: printableName(ch),
            codepoint: ch ? `U+${codepointHex(ch).toUpperCase()}` : "",
            width,
            cellHeight: CELL_H,
            xBreaks: X_BREAKS.slice(),
            yBreaks: Y_BREAKS.slice(),
            baselineY: Y.BASE0,
            polys: currentPolys(),
            storedGlyphAvailable: hasStoredGlyph(ch)
        };
    }

    function currentSvgMarkup() {
        const ch = getGlyphChar();
        const width = currentWidth();
        const hex = codepointHex(ch);
        const polys = currentPolys();

        const polyMarkup = polys.map(poly =>
            `    <polygon class="glyph glyph-u${hex}" points="${escapeXmlAttr(polyPoints(poly))}"/>`
        ).join("\n");

        const charAttr = ch ? ` data-char="${escapeXmlAttr(ch)}"` : "";
        const codeAttr = ch ? ` data-codepoint="U+${codepointHex(ch).toUpperCase()}"` : "";

        return [
            `<?xml version="1.0" encoding="utf-8"?>`,
            `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${CELL_H}" width="${width}" height="${CELL_H}" shape-rendering="crispEdges"${charAttr}${codeAttr}>`,
            `  <g>`,
            polyMarkup || `    <!-- empty glyph -->`,
            `  </g>`,
            `</svg>`,
            ``
        ].join("\n");
    }

    // -----------------------------
    // Glyph data loader
    // -----------------------------
    function keyCandidateToString(value) {
        if (typeof value === "number" && Number.isFinite(value)) {
            try {
                return String.fromCodePoint(value);
            } catch (_) {
                return "";
            }
        }

        if (typeof value !== "string") return "";

        const trimmed = value.trim();

        const uPlus = trimmed.match(/^U\+([0-9A-F]{1,6})$/i);
        if (uPlus) {
            try {
                return String.fromCodePoint(parseInt(uPlus[1], 16));
            } catch (_) {
                return "";
            }
        }

        const hex = trimmed.match(/^0x([0-9A-F]{1,6})$/i);
        if (hex) {
            try {
                return String.fromCodePoint(parseInt(hex[1], 16));
            } catch (_) {
                return "";
            }
        }

        if (/^\d+$/.test(trimmed)) {
            const n = Number(trimmed);
            if (Number.isFinite(n) && n >= 0) {
                try {
                    return String.fromCodePoint(n);
                } catch (_) {}
            }
        }

        return value;
    }

    function normalizeRectLike(item) {
        if (Array.isArray(item) && item.length >= 4) {
            const x1 = Number(item[0]);
            const y1 = Number(item[1]);
            const x2 = Number(item[2]);
            const y2 = Number(item[3]);
            if ([x1, y1, x2, y2].every(Number.isFinite)) return [x1, y1, x2, y2];
        }

        if (item && typeof item === "object") {
            if (["x1", "y1", "x2", "y2"].every(k => k in item)) {
                const x1 = Number(item.x1);
                const y1 = Number(item.y1);
                const x2 = Number(item.x2);
                const y2 = Number(item.y2);
                if ([x1, y1, x2, y2].every(Number.isFinite)) return [x1, y1, x2, y2];
            }

            if (["x", "y", "width", "height"].every(k => k in item)) {
                const x = Number(item.x);
                const y = Number(item.y);
                const w = Number(item.width);
                const h = Number(item.height);
                if ([x, y, w, h].every(Number.isFinite)) return [x, y, x + w, y + h];
            }
        }

        return null;
    }

    function normalizePoint(item) {
        if (Array.isArray(item) && item.length >= 2) {
            const x = Number(item[0]);
            const y = Number(item[1]);
            if ([x, y].every(Number.isFinite)) return [x, y];
        }

        if (item && typeof item === "object" && "x" in item && "y" in item) {
            const x = Number(item.x);
            const y = Number(item.y);
            if ([x, y].every(Number.isFinite)) return [x, y];
        }

        return null;
    }

    function polyToRect(poly) {
        if (!Array.isArray(poly) || poly.length < 2) return null;
        const pts = poly.map(normalizePoint).filter(Boolean);
        if (!pts.length) return null;

        const xs = pts.map(p => p[0]);
        const ys = pts.map(p => p[1]);
        return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
    }

    function extractRectsFromGlyph(raw) {
        if (!raw || typeof raw !== "object") return [];

        const directRects =
            raw.rects ??
            raw.rectangles ??
            raw.boxes ??
            null;

        if (Array.isArray(directRects)) {
            return directRects.map(normalizeRectLike).filter(Boolean);
        }

        const polys =
            raw.polys ??
            raw.polygons ??
            raw.points ??
            null;

        if (Array.isArray(polys)) {
            return polys.map(polyToRect).filter(Boolean);
        }

        return [];
    }

    function normalizeGlyphEntry(raw, fallbackKey = "") {
        if (!raw || typeof raw !== "object") return null;

        const rawKey =
            raw.key ??
            raw.char ??
            raw.character ??
            raw.glyph ??
            raw.name ??
            fallbackKey;

        const key = keyCandidateToString(rawKey);
        if (typeof key !== "string" || !key.length) return null;

        const width = Number(raw.width ?? raw.advanceWidth ?? raw.w ?? 0);
        const rects = extractRectsFromGlyph(raw);

        return {
            key,
            width: Number.isFinite(width) && width > 0 ? width : 12,
            rects,
            xBreaks: Array.isArray(raw.xBreaks) ? raw.xBreaks.map(Number) : null,
            yBreaks: Array.isArray(raw.yBreaks) ? raw.yBreaks.map(Number) : null
        };
    }

    function buildGlyphStoreFromJson(data) {
        glyphStore.clear();

        const pushEntry = (key, value) => {
            const glyph = normalizeGlyphEntry(value, key);
            if (glyph) glyphStore.set(glyph.key, glyph);
        };

        if (Array.isArray(data)) {
            for (const item of data) pushEntry("", item);
            return;
        }

        if (data && typeof data === "object") {
            if (Array.isArray(data.glyphs)) {
                for (const item of data.glyphs) pushEntry("", item);
                return;
            }

            for (const [key, value] of Object.entries(data)) {
                pushEntry(key, value);
            }
        }
    }

    async function loadGlyphStore() {
        glyphDataState.loading = true;
        glyphDataState.loaded = false;
        glyphDataState.error = "";
        glyphDataState.count = 0;
        updateUI();

        try {
            const response = await fetch(GLYPH_DATA_URL, { cache: "no-store" });
            if (!response.ok) {
                throw new Error(`HTTP ${response.status} ${response.statusText}`);
            }

            const data = await response.json();
            buildGlyphStoreFromJson(data);

            glyphDataState.loading = false;
            glyphDataState.loaded = true;
            glyphDataState.error = "";
            glyphDataState.count = glyphStore.size;
        } catch (err) {
            glyphDataState.loading = false;
            glyphDataState.loaded = false;
            glyphDataState.error = err && err.message ? err.message : String(err);
            glyphDataState.count = 0;
        }

        updateUI();
    }

    function hasStoredGlyph(ch) {
        return !!ch && glyphStore.has(ch);
    }

    function loadStoredGlyphForChar(ch) {
        if (!ch) return false;

        const glyph = glyphStore.get(ch);
        if (!glyph) return false;

        clearState();

        const units = clamp(Math.round(Number(glyph.width || 12) / 4), 1, 5);
        widthUnitsSelect.value = String(units);

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cell = cellRect(r, c);
                state[r][c] = glyph.rects.some(rect => rectCoversCell(rect, cell));
            }
        }

        updateUI();
        return true;
    }

    function maybeAutoLoadStoredGlyph() {
        const ch = getGlyphChar();
        if (hasStoredGlyph(ch)) {
            loadStoredGlyphForChar(ch);
        } else {
            updateUI();
        }
    }

    // -----------------------------
    // Editor SVG build
    // -----------------------------
    function makeLine(x1, y1, x2, y2, cls) {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", String(x1));
        line.setAttribute("y1", String(y1));
        line.setAttribute("x2", String(x2));
        line.setAttribute("y2", String(y2));
        line.setAttribute("class", cls);
        return line;
    }

    function buildEditorSvg() {
        const guideDefs = [
            { y: Y.CAP1, cls: "cap" },
            { y: Y.TOP0, cls: "xheight" },
            { y: Y.MID0, cls: "mid" },
            { y: Y.BASE0, cls: "base" },
            { y: Y.DESC0, cls: "desc" }
        ];

        for (const g of guideDefs) {
            editorSvg.appendChild(makeLine(0, g.y, 20, g.y, `guide ${g.cls}`));
        }

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const [x1, y1, x2, y2] = cellRect(r, c);
                const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rect.setAttribute("x", String(x1));
                rect.setAttribute("y", String(y1));
                rect.setAttribute("width", String(x2 - x1));
                rect.setAttribute("height", String(y2 - y1));
                rect.setAttribute("class", "cell");
                rect.dataset.r = String(r);
                rect.dataset.c = String(c);

                rect.addEventListener("pointerdown", onCellPointerDown);
                rect.addEventListener("pointerenter", onCellPointerEnter);

                editorSvg.appendChild(rect);
                cellEls[r][c] = rect;
            }
        }

        const outline = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        outline.setAttribute("x", "0");
        outline.setAttribute("y", "0");
        outline.setAttribute("width", "20");
        outline.setAttribute("height", "30");
        outline.setAttribute("fill", "none");
        outline.setAttribute("stroke", "var(--grid-stroke)");
        outline.setAttribute("stroke-width", "0.2");
        outline.setAttribute("pointer-events", "none");
        editorSvg.appendChild(outline);

        editorSvg.appendChild(makeLine(0, Y.BASE0, 20, Y.BASE0, "guide baseline"));

        editorSvg.addEventListener("pointerup", stopDragging);
        editorSvg.addEventListener("pointercancel", stopDragging);
        window.addEventListener("pointerup", stopDragging);
    }

    function onCellPointerDown(e) {
        const t = e.currentTarget;
        const r = Number(t.dataset.r);
        const c = Number(t.dataset.c);
        if (!inBoundsCell(r, c)) return;

        pointerDrag.active = true;
        pointerDrag.id = e.pointerId;
        pointerDrag.value = !state[r][c];

        try { t.setPointerCapture(e.pointerId); } catch (_) {}
        applyPaint(r, c, pointerDrag.value);
        e.preventDefault();
    }

    function onCellPointerEnter(e) {
        if (!pointerDrag.active) return;
        const t = e.currentTarget;
        const r = Number(t.dataset.r);
        const c = Number(t.dataset.c);
        applyPaint(r, c, pointerDrag.value);
    }

    function stopDragging() {
        pointerDrag.active = false;
        pointerDrag.id = null;
    }

    // -----------------------------
    // Theme
    // -----------------------------
    function getSavedThemeMode() {
        try {
            const value = localStorage.getItem(THEME_STORAGE_KEY);
            if (value === "device" || value === "light" || value === "dark") return value;
        } catch (_) {}
        return "device";
    }

    function applyThemeMode(mode, persist = true) {
        const html = document.documentElement;
        if (mode === "device") {
            html.removeAttribute("data-theme");
        } else {
            html.setAttribute("data-theme", mode);
        }

        themeModeSelect.value = mode;

        if (persist) {
            try { localStorage.setItem(THEME_STORAGE_KEY, mode); } catch (_) {}
        }
    }

    // -----------------------------
    // UI update / outputs
    // -----------------------------
    function updateWarn() {
        const ch = getGlyphChar();

        if (glyphDataState.loading) {
            warnEl.textContent = `Loading glyph data from ${GLYPH_DATA_URL}…`;
            return;
        }

        if (glyphDataState.error) {
            warnEl.textContent =
                `Could not load ${GLYPH_DATA_URL}: ${glyphDataState.error}\n` +
                `If you opened this file directly from disk, serve it over HTTP(S) instead of file://.`;
            return;
        }

        if (!ch) {
            warnEl.textContent = "Enter a character to label/export this glyph.";
            return;
        }

        if (inputHasMultipleChars()) {
            warnEl.textContent = "Multiple characters entered — only the first one is used.";
            return;
        }

        const glyph = glyphStore.get(ch);
        if (!glyph) {
            warnEl.textContent = `No stored glyph found for "${printableName(ch)}". Manual editing is enabled.`;
            return;
        }

        if (glyph.xBreaks && !arraysEqualNumberwise(glyph.xBreaks, X_BREAKS)) {
            warnEl.textContent = `Stored glyph found for "${printableName(ch)}", but its xBreaks differ from the current editor grid.`;
            return;
        }

        if (glyph.yBreaks && !arraysEqualNumberwise(glyph.yBreaks, Y_BREAKS)) {
            warnEl.textContent = `Stored glyph found for "${printableName(ch)}", but its yBreaks differ from the current editor grid.`;
            return;
        }

        warnEl.textContent = "";
    }

    function updateCellsVisual() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const el = cellEls[r][c];
                el.classList.toggle("active", !!state[r][c] && inBoundsCell(r, c));
                el.classList.toggle("oob", !inBoundsCell(r, c));
            }
        }
    }

    function updateOutputs() {
        const ch = getGlyphChar();
        const svg = currentSvgMarkup();
        const jsonObj = currentJsonObject();
        const rects = collectMergedRects();

        jsonOut.value = JSON.stringify(jsonObj, null, 2);
        svgOut.value = svg;
        svgPreview.innerHTML = svg.replace(/^<\?xml[^>]*\?>\s*/i, "");

        codepointBadge.textContent = `U+${codepointHex(ch).toUpperCase()}`;
        glyphStoreBadge.textContent = glyphDataState.loading
            ? "loading…"
            : glyphDataState.error
                ? "error"
                : String(glyphDataState.count);
        activeCountBadge.textContent = String(activeCellCount());
        rectCountBadge.textContent = String(rects.length);
        viewBoxBadge.textContent = `0 0 ${currentWidth()} 30`;
    }

    function updateUI() {
        updateWarn();
        updateCellsVisual();
        updateOutputs();
    }

    // -----------------------------
    // Actions
    // -----------------------------
    $("loadPresetBtn").addEventListener("click", () => {
        const ch = getGlyphChar();
        if (!loadStoredGlyphForChar(ch)) updateUI();
    });

    $("blankBtn").addEventListener("click", () => {
        clearState();
        updateUI();
    });

    $("spaceBtn").addEventListener("click", () => {
        glyphCharInput.value = " ";
        maybeAutoLoadStoredGlyph();
    });

    $("clearBtn").addEventListener("click", () => {
        clearState();
        updateUI();
    });

    $("invertBtn").addEventListener("click", invertInBounds);
    $("fitWidthBtn").addEventListener("click", fitWidthToContent);

    glyphCharInput.addEventListener("input", () => {
        maybeAutoLoadStoredGlyph();
    });

    widthUnitsSelect.addEventListener("change", updateUI);

    themeModeSelect.addEventListener("change", () => {
        applyThemeMode(themeModeSelect.value);
    });

    async function copyText(text) {
        try {
            await navigator.clipboard.writeText(text);
        } catch (_) {
            const ta = document.createElement("textarea");
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            ta.remove();
        }
    }

    $("copySvgBtn").addEventListener("click", () => copyText(svgOut.value));
    $("copyJsonBtn").addEventListener("click", () => copyText(jsonOut.value));

    function downloadText(filename, text, mime) {
        const blob = new Blob([text], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
    }

    $("downloadSvgBtn").addEventListener("click", () => {
        downloadText(filenameForCurrentGlyph("svg"), svgOut.value, "image/svg+xml;charset=utf-8");
    });

    $("downloadJsonBtn").addEventListener("click", () => {
        const fname = filenameForCurrentGlyph("json").replace(/^character/, "glyph");
        downloadText(fname, jsonOut.value, "application/json;charset=utf-8");
    });

    // -----------------------------
    // Boot
    // -----------------------------
    async function init() {
        applyThemeMode(getSavedThemeMode(), false);
        buildEditorSvg();
        updateUI();
        await loadGlyphStore();
        maybeAutoLoadStoredGlyph();
    }

    init();
</script>
</body>
</html>
