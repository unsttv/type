<!-- tests/letter-sample.html -->
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UNST Variable Font Tester</title>
    <style>
        :root{
            --wdth: 100;
            --hght: 100;
            --size: 72;
            --lh: 1.2;
        }

        @font-face{
            font-family: "unst";
            src:
                    url("../dist/fonts/unst.woff2") format("woff2"),
                    url("../dist/fonts/unst.woff") format("woff"),
                    url("../dist/fonts/unst.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        body{
            margin:0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background:#f6f6f6;
            color:#111;
        }

        .wrap{
            max-width: 1100px;
            margin: 24px auto;
            padding: 0 16px 40px;
        }

        .card{
            background:#fff;
            border:1px solid #ddd;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
        }

        .grid{
            display:grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        @media (min-width: 860px){
            .grid{ grid-template-columns: 340px 1fr; }
        }

        .controls label{
            display:block;
            font-size: 13px;
            margin: 10px 0 6px;
            color:#333;
        }

        .row{
            display:flex;
            align-items:center;
            gap:10px;
        }

        input[type="range"]{
            width: 100%;
        }

        .pill{
            font-variant-numeric: tabular-nums;
            background:#111;
            color:#fff;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 12px;
            min-width: 56px;
            text-align:center;
        }

        .btns{
            display:flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        button{
            border:1px solid #ccc;
            background:#fafafa;
            border-radius: 10px;
            padding: 8px 10px;
            cursor:pointer;
            font-size: 13px;
        }
        button:hover{ background:#f0f0f0; }

        .sample{
            background: repeating-linear-gradient(
                    0deg,
                    rgba(0,0,0,0.06),
                    rgba(0,0,0,0.06) 1px,
                    transparent 1px,
                    transparent 20px
            );
            border-radius: 14px;
            padding: 18px;
            border: 1px dashed #d7d7d7;
            overflow:auto;
        }

        .text{
            font-family: "unst", sans-serif;
            font-size: calc(var(--size) * 1px);
            line-height: var(--lh);
            white-space: pre-wrap;
            word-break: break-word;

            /* Variable font axes */
            font-variation-settings:
                    "wdth" var(--wdth),
                    "hght" var(--hght);
        }

        .meta{
            display:flex;
            gap:10px;
            flex-wrap: wrap;
            margin-top: 10px;
            font-size: 12px;
            color:#444;
        }
        .meta code{
            background:#eee;
            padding: 2px 6px;
            border-radius: 6px;
        }

        textarea{
            width:100%;
            height: 160px;
            resize: vertical;
            border:1px solid #ddd;
            border-radius: 12px;
            padding: 10px 12px;
            font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
<div class="wrap">
    <h1 style="margin:0 0 14px;font-size:18px;">UNST variable font tester</h1>

    <div class="grid">
        <div class="card controls">
            <label for="wdth">Width axis <code>"wdth"</code> (25–400)</label>
            <div class="row">
                <input id="wdth" type="range" min="25" max="400" value="100" />
                <div class="pill" id="wdthVal">100</div>
            </div>

            <label for="hght">Height axis <code>"hght"</code> (25–400)</label>
            <div class="row">
                <input id="hght" type="range" min="25" max="400" value="100" />
                <div class="pill" id="hghtVal">100</div>
            </div>

            <label for="size">Font size (px)</label>
            <div class="row">
                <input id="size" type="range" min="12" max="200" value="72" />
                <div class="pill" id="sizeVal">72</div>
            </div>

            <label for="lh">Line height (auto scales with Height)</label>
            <div class="row">
                <input id="lh" type="range" min="0.8" max="3.0" value="1.2" step="0.01" />
                <div class="pill" id="lhVal">1.20</div>
            </div>

            <div class="btns">
                <button type="button" data-preset="25,25">Condensed + Short</button>
                <button type="button" data-preset="25,100">Condensed</button>
                <button type="button" data-preset="100,100">Default</button>
                <button type="button" data-preset="200,200">Big</button>
                <button type="button" data-preset="400,400">Max</button>
            </div>

            <div style="margin-top:12px">
                <label for="input">Sample text</label>
                <textarea id="input" spellcheck="false">unst st ch ct fi ij sh
abcdefghijklmnopqrstuvwxyz
ABCDEFGHIJKLMNOPQRSTUVWXYZ
0123456789
!#$+,-.:;=?[]_{|}
¦§ ÷ ı ĳ ₿ ■

all glyphs from manifest:
 !#$+,-.0123456789:;=?ABCDEFGHIJKLMNOPQRSTUVWXYZ[]_abcdefghijklmnopqrstuvwxyz{|}¦§÷ıĳ₿■</textarea>
            </div>
        </div>

        <div class="card">
            <div class="sample">
                <div class="text" id="out"></div>
            </div>

            <div class="meta" id="meta">
                <span>settings:</span>
                <code id="cssOut"></code>
                <span>suggested line-height:</span>
                <code id="lhSuggest"></code>
            </div>
        </div>
    </div>
</div>

<script>
    const root = document.documentElement;

    const elWdth = document.getElementById("wdth");
    const elHght = document.getElementById("hght");
    const elSize = document.getElementById("size");
    const elLh   = document.getElementById("lh");

    const wdthVal = document.getElementById("wdthVal");
    const hghtVal = document.getElementById("hghtVal");
    const sizeVal = document.getElementById("sizeVal");
    const lhVal   = document.getElementById("lhVal");

    const input = document.getElementById("input");
    const out   = document.getElementById("out");
    const cssOut = document.getElementById("cssOut");
    const lhSuggest = document.getElementById("lhSuggest");

    let userEditedInput = false;

    function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }

    // Keep baseline-ish feel: as height grows, you usually want more line-height.
    // This is just a helpful starting point; user can override with the slider.
    function suggestedLineHeight(hght){
        // hght=100 => 1.2
        // hght=400 => ~3.6
        // hght=25  => ~0.9
        const t = hght / 100;
        return clamp(1.2 * t, 0.85, 4.0);
    }

    function sync(){
        const wdth = parseInt(elWdth.value, 10);
        const hght = parseInt(elHght.value, 10);
        const size = parseInt(elSize.value, 10);

        wdthVal.textContent = wdth;
        hghtVal.textContent = hght;
        sizeVal.textContent = size;

        // If user hasn't "touched" line-height recently, gently keep it in sync with height.
        // We'll detect this by checking a flag.
        if (!elLh.dataset.locked){
            const s = suggestedLineHeight(hght);
            elLh.value = s.toFixed(2);
        }

        const lh = parseFloat(elLh.value);
        lhVal.textContent = lh.toFixed(2);

        root.style.setProperty("--wdth", wdth);
        root.style.setProperty("--hght", hght);
        root.style.setProperty("--size", size);
        root.style.setProperty("--lh", lh);

        out.textContent = input.value;

        cssOut.textContent = `font-variation-settings: "wdth" ${wdth}, "hght" ${hght};`;
        lhSuggest.textContent = suggestedLineHeight(hght).toFixed(2);
    }

    function expandUnicodeRanges(unicodeRanges){
        const cps = [];
        if (!Array.isArray(unicodeRanges)) return cps;

        for (const pair of unicodeRanges){
            if (!Array.isArray(pair) || pair.length < 2) continue;
            const start = Number(pair[0]);
            const end   = Number(pair[1]);
            if (!Number.isFinite(start) || !Number.isFinite(end)) continue;

            for (let cp = start; cp <= end; cp++){
                cps.push(cp);
            }
        }
        return cps;
    }

    function uniqSorted(nums){
        return Array.from(new Set(nums)).sort((a,b) => a - b);
    }

    function codepointsToString(cps){
        return cps.map(cp => {
            try { return String.fromCodePoint(cp); }
            catch { return ""; }
        }).join("");
    }

    function chunkCodepoints(cps, size = 40){
        const lines = [];
        for (let i = 0; i < cps.length; i += size){
            lines.push(codepointsToString(cps.slice(i, i + size)));
        }
        return lines;
    }

    function buildSampleFromManifest(manifest){
        if (!manifest || !Array.isArray(manifest.unicodeRanges)) return null;

        const cps = uniqSorted(expandUnicodeRanges(manifest.unicodeRanges));
        if (!cps.length) return null;

        const lower = cps.filter(cp => cp >= 97 && cp <= 122);
        const upper = cps.filter(cp => cp >= 65 && cp <= 90);
        const digits = cps.filter(cp => cp >= 48 && cp <= 57);

        const asciiPunct = cps.filter(cp => {
            const isAscii = cp >= 32 && cp <= 126;
            const isDigit = cp >= 48 && cp <= 57;
            const isUpper = cp >= 65 && cp <= 90;
            const isLower = cp >= 97 && cp <= 122;
            return isAscii && !isDigit && !isUpper && !isLower;
        });

        const extras = cps.filter(cp => cp > 126);

        const lines = [
            // Keep explicit shaping test line for ligatures
            "unst st ch ct fi ij sh",
            lower.length ? codepointsToString(lower) : null,
            upper.length ? codepointsToString(upper) : null,
            digits.length ? codepointsToString(digits) : null,
            asciiPunct.length ? codepointsToString(asciiPunct) : null,
            extras.length ? codepointsToString(extras).split("").join(" ") : null,
            "",
            "all glyphs from manifest:",
            ...chunkCodepoints(cps, 40),
        ].filter(line => line !== null);

        return lines.join("\n");
    }

    async function loadManifestSample(){
        try{
            const res = await fetch("../data/manifest.json", { cache: "no-store" });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const manifest = await res.json();

            const sample = buildSampleFromManifest(manifest);
            if (sample && !userEditedInput){
                input.value = sample;
                sync();
            }
        }catch(err){
            // Fallback silently: textarea already contains a static sample.
            // (This commonly happens if opened directly as file:// and fetch is blocked.)
            console.warn("Could not load ../data/manifest.json for sample text:", err);
        }
    }

    // Lock line-height when user edits it manually
    elLh.addEventListener("input", () => {
        elLh.dataset.locked = "1";
        sync();
    });

    [elWdth, elHght, elSize].forEach(el => el.addEventListener("input", sync));
    input.addEventListener("input", () => {
        userEditedInput = true;
        sync();
    });

    document.querySelectorAll("button[data-preset]").forEach(btn => {
        btn.addEventListener("click", () => {
            const [w, h] = btn.dataset.preset.split(",").map(n => parseInt(n, 10));
            elWdth.value = w;
            elHght.value = h;

            // When applying a preset, unlock line-height so it follows height again
            delete elLh.dataset.locked;
            sync();
        });
    });

    sync();
    loadManifestSample();
</script>
</body>
</html>
