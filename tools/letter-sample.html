<!-- tests/letter-sample.html -->
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>UNST Variable Font Tester</title>
    <style>
        :root{
            --wdth: 100;
            --hght: 100;
            --size: 72;
            --lh: 1.2;

            --bg: #f6f7fb;
            --panel: #ffffff;
            --panel-2: #f3f5f9;
            --text: #111318;
            --muted: #5f6775;
            --border: #d8dde6;
            --accent: #2f6feb;
            --shadow: 0 8px 24px rgba(0,0,0,.06);

            --sample-grid: rgba(0,0,0,0.06);
            --sample-border: #d7d7d7;
            --pill-bg: #111;
            --pill-fg: #fff;
        }

        @media (prefers-color-scheme: dark){
            :root{
                --bg: #0d1117;
                --panel: #161b22;
                --panel-2: #0f141b;
                --text: #e6edf3;
                --muted: #9aa4b2;
                --border: #2a3340;
                --accent: #58a6ff;
                --shadow: 0 10px 30px rgba(0,0,0,.35);

                --sample-grid: rgba(255,255,255,0.08);
                --sample-border: #2a3340;
                --pill-bg: #e6edf3;
                --pill-fg: #0d1117;
            }
        }

        html[data-theme="light"]{
            color-scheme: light;
        }

        html[data-theme="dark"]{
            color-scheme: dark;

            --bg: #0d1117;
            --panel: #161b22;
            --panel-2: #0f141b;
            --text: #e6edf3;
            --muted: #9aa4b2;
            --border: #2a3340;
            --accent: #58a6ff;
            --shadow: 0 10px 30px rgba(0,0,0,.35);

            --sample-grid: rgba(255,255,255,0.08);
            --sample-border: #2a3340;
            --pill-bg: #e6edf3;
            --pill-fg: #0d1117;
        }

        *{
            box-sizing: border-box;
        }

        @font-face{
            font-family: "unst";
            src:
                    url("../dist/fonts/unst.woff2") format("woff2"),
                    url("../dist/fonts/unst.woff") format("woff"),
                    url("../dist/fonts/unst.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        html, body{
            min-height: 100%;
        }

        body{
            margin:0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .wrap{
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 16px 16px 40px;
        }

        .page-title{
            margin: 0 0 14px;
            font-size: 18px;
        }

        .grid{
            display:grid;
            grid-template-columns: 1fr;
            gap: 16px;
            align-items: start;
        }

        @media (min-width: 980px){
            .grid{
                grid-template-columns: 360px minmax(0, 1fr);
            }
        }

        .card{
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            box-shadow: var(--shadow);
            min-width: 0;
        }

        .controls{
            align-self: start;
        }

        @media (min-width: 980px){
            .controls{
                position: sticky;
                top: 16px;
            }
        }

        .controls label{
            display:block;
            font-size: 13px;
            margin: 10px 0 6px;
            color: var(--muted);
        }

        .row{
            display:flex;
            align-items:center;
            gap:10px;
        }

        input[type="range"]{
            width: 100%;
        }

        input[type="range"],
        textarea,
        select,
        button{
            accent-color: var(--accent);
        }

        .pill{
            font-variant-numeric: tabular-nums;
            background: var(--pill-bg);
            color: var(--pill-fg);
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 12px;
            min-width: 56px;
            text-align:center;
        }

        .btns{
            display:flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        button,
        select{
            border: 1px solid var(--border);
            background: var(--panel-2);
            color: var(--text);
            border-radius: 10px;
            padding: 8px 10px;
            font: inherit;
        }

        button{
            cursor:pointer;
            font-size: 13px;
        }

        button:hover{
            border-color: var(--accent);
        }

        select{
            width: 100%;
            height: 38px;
        }

        .sample{
            background: repeating-linear-gradient(
                    0deg,
                    var(--sample-grid),
                    var(--sample-grid) 1px,
                    transparent 1px,
                    transparent 20px
            );
            border-radius: 14px;
            padding: 18px;
            border: 1px dashed var(--sample-border);
            overflow: auto;
            min-height: 360px;
        }

        .text{
            font-family: "unst", sans-serif;
            font-size: calc(var(--size) * 1px);
            line-height: var(--lh);
            white-space: pre-wrap;
            word-break: break-word;
            outline: none;
            min-height: 280px;

            font-variation-settings:
                    "wdth" var(--wdth),
                    "hght" var(--hght);
        }

        .text:focus{
            box-shadow: inset 0 0 0 2px color-mix(in oklab, var(--accent) 55%, transparent);
            border-radius: 8px;
        }

        .helper{
            margin-top: 10px;
            font-size: 12px;
            color: var(--muted);
        }

        .meta{
            display:flex;
            gap:10px;
            flex-wrap: wrap;
            margin-top: 10px;
            font-size: 12px;
            color: var(--muted);
        }

        .meta code{
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 2px 6px;
            border-radius: 6px;
        }

        textarea{
            width:100%;
            height: 180px;
            resize: vertical;
            border:1px solid var(--border);
            border-radius: 12px;
            padding: 10px 12px;
            font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            box-sizing: border-box;
            background: var(--panel-2);
            color: var(--text);
        }

        textarea:focus,
        select:focus{
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 20%, transparent);
        }

        .field{
            margin-top: 12px;
        }
    </style>
</head>
<body>
<div class="wrap">
    <h1 class="page-title">UNST variable font tester</h1>

    <div class="grid">
        <div class="card controls">
            <label for="themeMode">Theme</label>
            <div class="field">
                <select id="themeMode">
                    <option value="device" selected>Device</option>
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>
            </div>

            <label for="wdth">Width axis <code>"wdth"</code> (25–400)</label>
            <div class="row">
                <input id="wdth" type="range" min="25" max="400" value="100" />
                <div class="pill" id="wdthVal">100</div>
            </div>

            <label for="hght">Height axis <code>"hght"</code> (25–400)</label>
            <div class="row">
                <input id="hght" type="range" min="25" max="400" value="100" />
                <div class="pill" id="hghtVal">100</div>
            </div>

            <label for="size">Font size (px)</label>
            <div class="row">
                <input id="size" type="range" min="12" max="200" value="72" />
                <div class="pill" id="sizeVal">72</div>
            </div>

            <label for="lh">Line height (auto scales with Height)</label>
            <div class="row">
                <input id="lh" type="range" min="0.8" max="3.0" value="1.2" step="0.01" />
                <div class="pill" id="lhVal">1.20</div>
            </div>

            <div class="btns">
                <button type="button" data-preset="25,25">Condensed + Short</button>
                <button type="button" data-preset="25,100">Condensed</button>
                <button type="button" data-preset="100,100">Default</button>
                <button type="button" data-preset="200,200">Big</button>
                <button type="button" data-preset="400,400">Max</button>
            </div>

            <div class="field">
                <label for="input">Sample text</label>
                <textarea id="input" spellcheck="false">Loading glyphs.json… (if this stays, open via a local server or paste a file via a picker)</textarea>
            </div>
        </div>

        <div class="card">
            <div class="sample">
                <div
                        class="text"
                        id="out"
                        contenteditable="true"
                        spellcheck="false"
                        role="textbox"
                        aria-multiline="true"
                        aria-label="Editable font sample"
                ></div>
            </div>

            <div class="helper">
                You can edit the sample here directly, or in the text field on the left.
            </div>

            <div class="meta" id="meta">
                <span>settings:</span>
                <code id="cssOut"></code>
                <span>suggested line-height:</span>
                <code id="lhSuggest"></code>
            </div>
        </div>
    </div>
</div>

<script>
    const THEME_STORAGE_KEY = "unst-letter-sample-theme";
    const root = document.documentElement;

    const elTheme = document.getElementById("themeMode");
    const elWdth = document.getElementById("wdth");
    const elHght = document.getElementById("hght");
    const elSize = document.getElementById("size");
    const elLh   = document.getElementById("lh");

    const wdthVal = document.getElementById("wdthVal");
    const hghtVal = document.getElementById("hghtVal");
    const sizeVal = document.getElementById("sizeVal");
    const lhVal   = document.getElementById("lhVal");

    const input = document.getElementById("input");
    const out   = document.getElementById("out");
    const cssOut = document.getElementById("cssOut");
    const lhSuggest = document.getElementById("lhSuggest");

    let userEditedInput = false;
    let syncingFromTextarea = false;
    let syncingFromSample = false;

    function clamp(n, a, b){
        return Math.max(a, Math.min(b, n));
    }

    function suggestedLineHeight(hght){
        const t = hght / 100;
        return clamp(1.2 * t, 0.85, 4.0);
    }

    function applyTheme(mode, persist = true){
        if (mode === "device") {
            document.documentElement.removeAttribute("data-theme");
        } else {
            document.documentElement.setAttribute("data-theme", mode);
        }

        elTheme.value = mode;

        if (persist) {
            try {
                localStorage.setItem(THEME_STORAGE_KEY, mode);
            } catch (_) {}
        }
    }

    function loadTheme(){
        try {
            const saved = localStorage.getItem(THEME_STORAGE_KEY);
            if (saved === "light" || saved === "dark" || saved === "device") {
                applyTheme(saved, false);
                return;
            }
        } catch (_) {}
        applyTheme("device", false);
    }

    function getSampleText(){
        return out.textContent ?? "";
    }

    function setSampleText(text){
        const normalized = String(text ?? "");
        if (getSampleText() !== normalized) {
            out.textContent = normalized;
        }
    }

    function syncStyleOnly(){
        const wdth = parseInt(elWdth.value, 10);
        const hght = parseInt(elHght.value, 10);
        const size = parseInt(elSize.value, 10);

        wdthVal.textContent = wdth;
        hghtVal.textContent = hght;
        sizeVal.textContent = size;

        if (!elLh.dataset.locked){
            const s = suggestedLineHeight(hght);
            elLh.value = s.toFixed(2);
        }

        const lh = parseFloat(elLh.value);
        lhVal.textContent = lh.toFixed(2);

        root.style.setProperty("--wdth", wdth);
        root.style.setProperty("--hght", hght);
        root.style.setProperty("--size", size);
        root.style.setProperty("--lh", lh);

        cssOut.textContent = `font-variation-settings: "wdth" ${wdth}, "hght" ${hght};`;
        lhSuggest.textContent = suggestedLineHeight(hght).toFixed(2);
    }

    function syncFromTextarea(){
        syncingFromTextarea = true;
        setSampleText(input.value);
        syncStyleOnly();
        syncingFromTextarea = false;
    }

    function syncFromSample(){
        syncingFromSample = true;
        input.value = getSampleText();
        syncStyleOnly();
        syncingFromSample = false;
    }

    function syncAll(){
        setSampleText(input.value);
        syncStyleOnly();
    }

    function uniqSorted(nums){
        return Array.from(new Set(nums)).sort((a,b) => a - b);
    }

    function codepointsToString(cps){
        return cps.map(cp => {
            try { return String.fromCodePoint(cp); }
            catch { return ""; }
        }).join("");
    }

    function safeCp(ch){
        try { return ch.codePointAt(0); } catch { return null; }
    }

    function getSinglesFromGlyphsJson(data){
        const cps = [];
        if (!data || typeof data !== "object" || !data.glyphs) return cps;

        if (data.indices && data.indices.byChar && typeof data.indices.byChar === "object") {
            for (const ch of Object.keys(data.indices.byChar)) {
                const cp = safeCp(ch);
                if (cp !== null && cp >= 32 && !/\s/.test(ch)) cps.push(cp);
                if (ch === " ") cps.push(32);
            }
            return uniqSorted(cps);
        }

        for (const rec of Object.values(data.glyphs)) {
            if (!rec || typeof rec !== "object") continue;
            const ch = rec.key;
            if (typeof ch !== "string" || Array.from(ch).length !== 1) continue;
            const cp = safeCp(ch);
            if (cp === null) continue;
            if (cp < 32) continue;
            cps.push(cp);
        }
        return uniqSorted(cps);
    }

    function getLigatureKeysFromGlyphsJson(data){
        const keys = [];

        if (!data || typeof data !== "object") return keys;

        if (data.indices && data.indices.ligaturesByKey && typeof data.indices.ligaturesByKey === "object") {
            keys.push(...Object.keys(data.indices.ligaturesByKey));
        } else if (data.ligatures && typeof data.ligatures === "object") {
            for (const rec of Object.values(data.ligatures)) {
                if (!rec || typeof rec !== "object") continue;
                const k = rec.key;
                if (typeof k === "string" && Array.from(k).length >= 2) keys.push(k);
            }
        } else if (data.glyphs && typeof data.glyphs === "object") {
            for (const rec of Object.values(data.glyphs)) {
                if (!rec || typeof rec !== "object") continue;
                const k = rec.key;
                if (typeof k === "string" && Array.from(k).length >= 2) keys.push(k);
            }
        }

        const uniq = Array.from(new Set(keys));
        uniq.sort((a, b) => {
            const ac = Array.from(a).map(ch => ch.codePointAt(0));
            const bc = Array.from(b).map(ch => ch.codePointAt(0));
            if (ac.length !== bc.length) return ac.length - bc.length;
            for (let i = 0; i < Math.max(ac.length, bc.length); i++){
                const av = ac[i] ?? -1;
                const bv = bc[i] ?? -1;
                if (av !== bv) return av - bv;
            }
            return a.localeCompare(b);
        });

        return uniq;
    }

    function buildSampleFromGlyphsJson(data){
        const cps = getSinglesFromGlyphsJson(data);
        const ligs = getLigatureKeysFromGlyphsJson(data);

        if (!cps.length && !ligs.length) return null;

        const lower = cps.filter(cp => cp >= 97 && cp <= 122);
        const upper = cps.filter(cp => cp >= 65 && cp <= 90);
        const digits = cps.filter(cp => cp >= 48 && cp <= 57);

        const asciiPunct = cps.filter(cp => {
            const isAscii = cp >= 32 && cp <= 126;
            const isDigit = cp >= 48 && cp <= 57;
            const isUpper = cp >= 65 && cp <= 90;
            const isLower = cp >= 97 && cp <= 122;
            return isAscii && !isDigit && !isUpper && !isLower;
        });

        const extras = cps.filter(cp => cp > 126);

        const lines = [
            lower.length ? codepointsToString(lower) : null,
            upper.length ? codepointsToString(upper) : null,
            digits.length ? codepointsToString(digits) : null,
            asciiPunct.length ? codepointsToString(asciiPunct) : null,
            extras.length ? extras.map(cp => String.fromCodePoint(cp)).join(" ") : null,
            ligs.length ? ligs.join(" ") : null
        ].filter(line => line !== null);

        return lines.join("\n");
    }

    async function loadGlyphsSampleOnce(){
        const candidates = [
            "../data/glyphs.json",
            "./data/glyphs.json",
            "data/glyphs.json",
            "./glyphs.json",
        ];

        let lastErr = null;

        for (const url of candidates){
            try{
                const res = await fetch(url, { cache: "no-store" });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                const sample = buildSampleFromGlyphsJson(data);
                if (sample && !userEditedInput){
                    input.value = sample;
                    syncAll();
                }
                return;
            }catch(err){
                lastErr = err;
            }
        }

        console.warn("Could not load glyphs.json for sample text:", lastErr);
        syncAll();
    }

    function insertPlainTextAtCursor(text){
        const selection = window.getSelection();
        if (!selection || !selection.rangeCount) return;

        const range = selection.getRangeAt(0);
        range.deleteContents();

        const node = document.createTextNode(text);
        range.insertNode(node);

        range.setStartAfter(node);
        range.setEndAfter(node);
        selection.removeAllRanges();
        selection.addRange(range);
    }

    elTheme.addEventListener("change", () => {
        applyTheme(elTheme.value);
    });

    elLh.addEventListener("input", () => {
        elLh.dataset.locked = "1";
        syncStyleOnly();
    });

    [elWdth, elHght, elSize].forEach(el => {
        el.addEventListener("input", syncStyleOnly);
    });

    input.addEventListener("input", () => {
        if (syncingFromSample) return;
        userEditedInput = true;
        syncFromTextarea();
    });

    out.addEventListener("input", () => {
        if (syncingFromTextarea) return;
        userEditedInput = true;
        syncFromSample();
    });

    out.addEventListener("paste", (e) => {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData("text/plain");
        insertPlainTextAtCursor(text);
        userEditedInput = true;
        syncFromSample();
    });

    document.querySelectorAll("button[data-preset]").forEach(btn => {
        btn.addEventListener("click", () => {
            const [w, h] = btn.dataset.preset.split(",").map(n => parseInt(n, 10));
            elWdth.value = w;
            elHght.value = h;
            delete elLh.dataset.locked;
            syncStyleOnly();
        });
    });

    loadTheme();
    syncAll();
    loadGlyphsSampleOnce();
</script>
</body>
</html>
